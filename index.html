<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neuburg Explorer">
<title>NEUBURG CHAOS EXPLORER</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loadingScreen">
  <h1>NEUBURG<br>CHAOS EXPLORER</h1>
  <p id="loadingText">Altstadt wird geladen…</p>
</div>

<div id="hud">
  <div class="badge" id="currencyBadge">
    <div class="amount" id="amountText">0 ✨</div>
    <div class="rate" id="rateText">+0/s</div>
  </div>
  <div class="badge" id="discoverBadge">
    ORTE ENTDECKT<br><span class="count" id="discoverCount">0/8</span>
  </div>
</div>

<div id="canvasWrap"></div>
<div id="labelLayer"></div>

<div id="joyBase"><div id="joyKnob"></div></div>
<button id="interactBtn">Betreten</button>

<div id="modalOverlay">
  <div id="modalCard">
    <h2 id="modalTitle">—</h2>
    <p id="modalFlavor">—</p>
    <div id="modalReward"></div>
    <button id="modalClose">Weiter erkunden</button>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
